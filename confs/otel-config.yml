receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  prometheus:
    config:
      scrape_configs:
        - job_name: 'litellm-exporter'
          static_configs:
            - targets: ['litellm-exporter:9090']
        - job_name: 'db-openwebui'
          static_configs:
            - targets: ['db-openwebui-exporter:9187']
        - job_name: 'db-litellm'
          static_configs:
            - targets: ['db-litellm-exporter:9187']
        - job_name: 'openwebui-exporter'
          static_configs:
            - targets: ['openwebui-exporter:9090']
exporters:
  otlp:
    endpoint: http://tempo:7134
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write

connectors:

processors:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [otlp]
    metrics:
      receivers: [otlp, prometheus]
      processors: []
      exporters: [prometheusremotewrite]
