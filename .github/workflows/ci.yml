---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .env is gitignored. Validating with the example checks that it
      # interpolates cleanly into both compose files.
      - name: Create .env from the example
        run: cp .env.example .env

      - name: docker compose config (compose.yml)
        run: docker compose -f compose.yml config -q

      - name: docker compose config (compose.yml + otel.compose.yml)
        run: docker compose -f compose.yml -f otel.compose.yml config -q

      # Compose v2+ silently coerces unquoted booleans in `environment:` maps
      # to strings, but Compose v1 and the strict schema reject them, so
      # `docker compose config` alone does not catch them.
      - name: No unquoted booleans in compose environment maps
        env:
          # renovate: datasource=docker
          YQ_IMAGE: mikefarah/yq:4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
        run: |
          query='.services[]?.environment | select(tag == "!!map") | .[]
            | select(tag == "!!bool")
            | filename + ":" + (line | tostring) + ":" + key + ": " + to_string'
          found=$(docker run --rm -v "$PWD:/workdir" "$YQ_IMAGE" \
            -N "$query" compose.yml otel.compose.yml)
          if [ -n "$found" ]; then
            while IFS=: read -r file line rest; do
              echo "::error file=${file},line=${line}::Quote this environment value: ${rest}"
            done <<< "$found"
            exit 1
          fi

      - name: Install yamllint
        env:
          # renovate: datasource=pypi depName=yamllint
          YAMLLINT_VERSION: 1.38.0
        run: pipx install "yamllint==${YAMLLINT_VERSION}"

      - name: yamllint
        run: yamllint --format github .

      - name: Validate confs/mcp-config.json
        run: jq empty confs/mcp-config.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=docker
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git --redact --verbose --exit-code 1 /repo
