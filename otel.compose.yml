x-openwebui-otel-env: &openwebui-otel-env
  ENABLE_OTEL: "true"
  ENABLE_OTEL_TRACES: "true"
  ENABLE_OTEL_METRICS: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  # Both instances report as one service; service.instance.id tells them apart.
  OTEL_SERVICE_NAME: openwebui
  # OTEL_TRACES_SAMPLER: parentbased_always_on
  # OTEL_TRACES_SAMPLER: parentbased_traceidratio
  # OTEL_TRACES_SAMPLER_ARG: 0.5

services:
  # override the openwebui services
  openwebui:
    environment:
      <<: *openwebui-otel-env
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=openwebui-1

  openwebui-2:
    environment:
      <<: *openwebui-otel-env
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=openwebui-2

  opentelemetry:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    volumes:
      - ./confs/otel-config.yml:/otel-config.yml
    command: ["--config", "/otel-config.yml"]
    depends_on:
      - db-openwebui-exporter
      - db-litellm-exporter
      - openwebui-exporter
    networks:
      - netopenwebui

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./confs/tempo-config.yml:/etc/tempo.yml
      - tempo_data:/var/tempo
    networks:
      - netopenwebui

  litellm-exporter:
    image: nicholascecere/exporter-litellm:1.2.0@sha256:707a5186d4bda736dd88e9202da353f160c6cabf68b229db850bf6d0ab4e7c29
    depends_on:
      - db-litellm
    environment:
      - LITELLM_DB_HOST=db-litellm
      - LITELLM_DB_PORT=5432
      - LITELLM_DB_NAME=litellm
      - LITELLM_DB_USER=litellm
      - LITELLM_DB_PASSWORD=${LITELLM_DB_PASSWORD:-password}
      - DB_MIN_CONNECTIONS=1
      - DB_MAX_CONNECTIONS=10
      - METRICS_UPDATE_INTERVAL=15
      - METRICS_SPEND_WINDOW=30d
      - METRICS_REQUEST_WINDOW=24h
      - METRICS_ERROR_WINDOW=1h
    networks:
      - netopenwebui

  db-openwebui-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: "postgresql://openwebui:${OPENWEBUI_DB_PASSWORD:-password}@db-openwebui:5432/openwebui?sslmode=disable"
    depends_on:
      - db-openwebui
    networks:
      - netopenwebui
  db-litellm-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_NAME: "postgresql://litellm:${LITELLM_DB_PASSWORD:-password}@db-litellm:5432/litellm?sslmode=disable"
    depends_on:
      - db-litellm
    networks:
      - netopenwebui

  openwebui-exporter:
    image: nicholascecere/exporter-openwebui:1.3.2@sha256:cb899509d87986637ca34aafffa69b6ecf42d563f1d0af5c20699e31df657876
    depends_on:
      - db-openwebui
    environment:
      - OPENWEBUI_DB_HOST=db-openwebui
      - OPENWEBUI_DB_PORT=5432
      - OPENWEBUI_DB_NAME=openwebui
      - OPENWEBUI_DB_USER=openwebui
      - OPENWEBUI_DB_PASSWORD=${OPENWEBUI_DB_PASSWORD:-password}
      - DB_MIN_CONNECTIONS=1
      - DB_MAX_CONNECTIONS=10
      - METRICS_UPDATE_INTERVAL=15
      - METRICS_SPEND_WINDOW=30d
      - METRICS_REQUEST_WINDOW=24h
      - METRICS_ERROR_WINDOW=1h
    networks:
      - netopenwebui

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./confs/prometheus.yml:/etc/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - netopenwebui

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yml
        apiVersion: 1
        datasources:
        - name: Tempo
          type: tempo
          access: proxy
          orgId: 1
          url: http://tempo:3200
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        - name: Prometheus
          type: prometheus
          access: proxy
          orgId: 1
          url: http://prometheus:9090
          basicAuth: false
          isDefault: false
          version: 1
          editable: false
        EOF
        /run.sh
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    networks:
      - netopenwebui

volumes:
  grafana_data:
  tempo_data:
