services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.13.0-slim
    ports:
      - "3000:8080"
    environment:
        GLOBAL_LOG_LEVEL: INFO
        DATABASE_URL: "postgresql://openwebui:password@db-openwebui:5432/openwebui"
        OPENAI_API_BASE_URL: "http://litellm:4000"
        OPENAI_API_KEY: "sk-1234"
        RAG_OPENAI_API_BASE_URL: "http://litellm:4000"
        RAG_OPENAI_API_KEY: "sk-1234"
        RAG_EMBEDDING_ENGINE: "openai"
        RAG_EMBEDDING_MODEL: "text-embedding-3-small"
        IMAGES_OPENAI_API_BASE_URL: "http://litellm:4000"
        IMAGES_OPENAI_API_KEY: "sk-1234"
        REDIS_URL: "redis://valkey:6379/1"
        ENABLE_WEBSOCKET_SUPPORT: "true"
        WEBSOCKET_MANAGER: "redis"
        WEBSOCKET_REDIS_URL: "redis://valkey:6379/0"
        WEBUI_SECRET_KEY: "secret"
        VECTOR_DB: pgvector
        STORAGE_PROVIDER: s3
        S3_ACCESS_KEY_ID: admin
        S3_SECRET_ACCESS_KEY: password
        S3_REGION_NAME:
        S3_ENDPOINT_URL: http://minio:9000
        S3_BUCKET_NAME: openwebui
        ENABLE_FORWARD_USER_INFO_HEADERS: true
    volumes:
      - ./.data:/app/backend/data
    depends_on:
      db-openwebui:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - netopenwebui

  openwebui-2:
    image: ghcr.io/open-webui/open-webui:v0.13.0-slim
    ports:
      - "3001:8080"
    environment:
        GLOBAL_LOG_LEVEL: INFO
        DATABASE_URL: "postgresql://openwebui:password@db-openwebui:5432/openwebui"
        OPENAI_API_BASE_URL: "http://litellm:4000"
        OPENAI_API_KEY: "sk-1234"
        RAG_OPENAI_API_BASE_URL: "http://litellm:4000"
        RAG_OPENAI_API_KEY: "sk-1234"
        RAG_EMBEDDING_ENGINE: "openai"
        RAG_EMBEDDING_MODEL: "text-embedding-3-small"
        IMAGES_OPENAI_API_BASE_URL: "http://litellm:4000"
        IMAGES_OPENAI_API_KEY: "sk-1234"
        REDIS_URL: "redis://valkey:6379/1"
        ENABLE_WEBSOCKET_SUPPORT: "true"
        WEBSOCKET_MANAGER: "redis"
        WEBSOCKET_REDIS_URL: "redis://valkey:6379/0"
        WEBUI_SECRET_KEY: "secret"
        VECTOR_DB: pgvector
        STORAGE_PROVIDER: s3
        S3_ACCESS_KEY_ID: admin
        S3_SECRET_ACCESS_KEY: password
        S3_REGION_NAME:
        S3_ENDPOINT_URL: http://minio:9000
        S3_BUCKET_NAME: openwebui
        ENABLE_FORWARD_USER_INFO_HEADERS: true
    volumes:
      - openwebui-2-data:/app/backend/data
    depends_on:
      db-openwebui:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # Both instances run DB migrations on start. Starting them together
      # races, and the loser exits, so let the first one finish.
      openwebui:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - netopenwebui

  litellm:
    image: ghcr.io/berriai/litellm:v1.108.2@sha256:d8b4ac356743d647a13bb93f45b941fcd5f5354122cfd205948a1b192790389d
    ports:
      - "4000:4000"
    environment:
        # Known default key for local demos: replace it for any real or exposed deployment.
        LITELLM_MASTER_KEY: "sk-1234"
        LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY: "true"
        DATABASE_URL: "postgresql://litellm:password@db-litellm:5432/litellm"
        STORE_MODEL_IN_DB: "True"
    env_file:
      - ./envs/litellm.env
    volumes:
      - ./confs/litellm-config.yml:/app/proxy_server_config.yml
    command: ["--config", "/app/proxy_server_config.yml"]
    depends_on:
      db-litellm:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - netopenwebui

  mcpo:
    image: ghcr.io/open-webui/mcpo:git-788ff92@sha256:1e82c9555c19e50b80745705f32b47a2647589f35279527b5118ecd3a71bd467
    command: ["--api-key", "sk-1234", "--config", "/etc/mcp/config.json"]
    volumes:
      - ./confs/mcp-config.json:/etc/mcp/config.json
    ports:
      - "5000:8000"
    networks:
      - netopenwebui

  db-openwebui:
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:9cf8b511f0e9a2c209b61430fc139f1ab9c75edbb31fb1751db6617b246a897a
    command: ["postgres", "-c", "log_min_messages=DEBUG1"]
    environment:
      POSTGRES_DB: openwebui
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: password
    volumes:
      - db-openwebui-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d openwebui -U openwebui"]
      interval: 1s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - netopenwebui

  db-litellm:
    image: postgres:16
    command: ["postgres", "-c", "log_min_messages=DEBUG1"]
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: password
    volumes:
      - db-litellm-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - netopenwebui

  valkey:
    image: valkey/valkey:8.1.1
    volumes:
      - valkey-data:/data
    command: "valkey-server --save 30 1"
    healthcheck:
      test: "[ $$(valkey-cli ping) = 'PONG' ]"
      start_period: 5s
      interval: 1s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - netopenwebui

  minio:
    # The MinIO project's own images are gone from Docker Hub and quay.io.
    image: cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    # Runs as UID 65532, which can only write to a volume mounted on /data.
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
        MINIO_ROOT_USER: admin
        MINIO_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - netopenwebui
    volumes:
      - minio-data:/data

  createbuckets:
    # This image has no shell, so mc takes its alias from MC_HOST_<alias>.
    image: cgr.dev/chainguard/minio-client@sha256:7e80e77f8c949810d0eaead1120e28c63f913ff96ae7f78a8e4cd3c1e2f0623f
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    environment:
      MC_HOST_dockerminio: http://admin:password@minio:9000
    command: ["mb", "--ignore-existing", "dockerminio/openwebui"]
    networks:
      - netopenwebui

networks:
  netopenwebui:
    driver: bridge

volumes:
  valkey-data:
  db-litellm-data:
  db-openwebui-data:
  minio-data:
  openwebui-2-data: